---
# Template Zabbix - Monitoramento de Câmeras IP
# Projeto: Aeroporto
# Data: 24/10/2026
# Versão: 1.0
# Aplicável a: Câmeras IP (382 dispositivos)

zabbix_export:
  version: '5.4'
  date: '2026-10-24T00:00:00Z'
  groups:
    - name: "Cameras"
      uuid: "a8f96dd9d5e6479b84a1a7f7e6e5d5e5"
  
  templates:
    - name: "Câmera IP - Monitoramento Completo"
      description: "Template para monitorar câmeras IP em tempo real"
      uuid: "b9a7ee0ae6f7480c95b2b8f8f7f6e6f6"
      group: "Cameras"
      
      items:
        # Conectividade ICMP (Ping)
        - name: "Ping (ICMP)"
          type: "SIMPLE_SNMP_CHECK"
          key: "icmpping"
          delay: "60s"
          history: "7d"
          trends: "365d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          units: "ms"
          
        # HTTP Status
        - name: "HTTP Status (porta 80)"
          type: "HTTP_AGENT"
          key: "http.status[80]"
          delay: "120s"
          history: "7d"
          trends: "365d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          url: "http://{HOST.CONN}:80/"
          
        # HTTPS Status
        - name: "HTTPS Status (porta 443)"
          type: "HTTP_AGENT"
          key: "http.status[443]"
          delay: "120s"
          history: "7d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          url: "https://{HOST.CONN}:443/"
          
        # Uso de Disco
        - name: "Armazenamento (Disco) - Espaço Livre"
          type: "SNMP_AGENT"
          key: "storage.disk.free"
          delay: "300s"
          history: "30d"
          trends: "90d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          units: "bytes"
          snmp_oid: "1.3.6.1.2.1.25.2.3.1.4.1"
          
        - name: "Armazenamento (Disco) - Espaço Total"
          type: "SNMP_AGENT"
          key: "storage.disk.total"
          delay: "300s"
          history: "30d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          units: "bytes"
          snmp_oid: "1.3.6.1.2.1.25.2.3.1.5.1"
        
        # CPU
        - name: "CPU - Utilização"
          type: "SNMP_AGENT"
          key: "cpu.usage"
          delay: "60s"
          history: "30d"
          trends: "90d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          units: "%"
          snmp_oid: "1.3.6.1.4.1.2021.11.9.0"
          
        # RAM
        - name: "Memória - Utilização"
          type: "SNMP_AGENT"
          key: "memory.usage"
          delay: "60s"
          history: "30d"
          trends: "90d"
          status: "ACTIVE"
          value_type: "UNSIGNED"
          units: "%"
          snmp_oid: "1.3.6.1.4.1.2021.4.6.0"
        
        # Temperatura
        - name: "Temperatura - Sensor Interno"
          type: "SNMP_AGENT"
          key: "temperature.sensor"
          delay: "120s"
          history: "30d"
          trends: "90d"
          status: "ACTIVE"
          value_type: "FLOAT"
          units: "°C"
          snmp_oid: "1.3.6.1.4.1.2021.13.16.2.1.3.1"
          
      triggers:
        # Trigger: Câmera Offline
        - name: "Câmera {HOST.NAME} está OFFLINE"
          expression: |
            {Câmera IP - Monitoramento Completo:icmpping.nodata(180)}=1 or 
            {Câmera IP - Monitoramento Completo:http.status[80].eq(0)}=1
          severity: "HIGH"
          description: "Câmera não está respondendo a PING ou HTTP"
          enabled: "YES"
          
        # Trigger: Espaço em disco baixo
        - name: "Disco baixo em {HOST.NAME} (< 20%)"
          expression: |
            ({Câmera IP - Monitoramento Completo:storage.disk.free.last()} / 
             {Câmera IP - Monitoramento Completo:storage.disk.total.last()}) * 100 < 20
          severity: "AVERAGE"
          description: "Espaço livre em disco abaixo de 20%"
          enabled: "YES"
          
        # Trigger: CPU Alta
        - name: "CPU alta em {HOST.NAME} (> 80%)"
          expression: |
            {Câmera IP - Monitoramento Completo:cpu.usage.avg(300)}>80
          severity: "AVERAGE"
          description: "Utilização de CPU acima de 80% por 5 minutos"
          enabled: "YES"
          
        # Trigger: Memória Alta
        - name: "Memória alta em {HOST.NAME} (> 85%)"
          expression: |
            {Câmera IP - Monitoramento Completo:memory.usage.avg(300)}>85
          severity: "AVERAGE"
          description: "Utilização de memória acima de 85%"
          enabled: "YES"
          
        # Trigger: Temperatura Alta
        - name: "Temperatura alta em {HOST.NAME} (> 60°C)"
          expression: |
            {Câmera IP - Monitoramento Completo:temperature.sensor.avg(300)}>60
          severity: "AVERAGE"
          description: "Temperatura do sensor acima de 60°C"
          enabled: "YES"
      
      graphs:
        - name: "CPU, Memória, Temperatura"
          graph_items:
            - item_name: "CPU - Utilização"
              color: "FF3333"
            - item_name: "Memória - Utilização"
              color: "3333FF"
            - item_name: "Temperatura - Sensor Interno"
              color: "FFBB00"
        
        - name: "Utilização de Disco"
          graph_items:
            - item_name: "Armazenamento (Disco) - Espaço Livre"
              color: "33FF33"
            - item_name: "Armazenamento (Disco) - Espaço Total"
              color: "FF3333"
